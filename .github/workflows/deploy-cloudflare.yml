# .github/workflows/deploy-cloudflare.yml
#
# Deploy to Cloudflare Pages — runs in parallel with the GitHub Pages deploy.
#
# Triggers automatically on every push to main and can also be triggered
# manually from the Actions tab.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — Your Cloudflare account ID (found in the dashboard)
#
# The Cloudflare Pages project name is "loveveryfans".
# If you use a different name, update the `projectName` field below.
#
# NOTE: We deliberately avoid cloudflare/wrangler-action@v3 because it
# internally runs `npm install wrangler` which causes ERESOLVE conflicts
# with the project's pnpm + vite@7 dependency tree. Instead we install
# wrangler manually via pnpm and call it directly.
name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Allow only one concurrent deployment at a time
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
      # ── 2. Node.js + pnpm ─────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      # ── 3. Install & Build ────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm run build:static
      # ── 4. Deploy to Cloudflare Pages ─────────────────────────────
      # Install wrangler as a standalone global tool via pnpm to avoid
      # any dependency tree conflicts with the project.
      - name: Install wrangler
        run: pnpm add -g wrangler@latest
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=loveveryfans --commit-dirty=true
