# .github/workflows/deploy-cloudflare.yml
#
# Deploy to Cloudflare Pages — runs in parallel with the GitHub Pages deploy.
#
# Triggers automatically on every push to main and can also be triggered
# manually from the Actions tab.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — Your Cloudflare account ID (found in the dashboard)
#
# The Cloudflare Pages project name is "loveveryfans".
# If you use a different name, update the `projectName` field below.
name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Allow only one concurrent deployment at a time
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
      # ── 2. Node.js + pnpm ─────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      # ── 3. Install & Build ────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm run build:static
      # ── 4. Deploy to Cloudflare Pages ─────────────────────────────
      # wrangler-action@v3 internally runs `npm i wrangler` which can
      # conflict with pnpm workspaces.  Pre-installing wrangler via pnpm
      # and setting wranglerVersion to the installed version avoids this.
      - name: Install wrangler
        run: pnpm add -g wrangler@latest
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=loveveryfans --commit-dirty=true
          wranglerVersion: ""
