# .github/workflows/update-prices.yml
#
# Scheduled Price Update + Availability Check
#
# Runs every Monday at 02:00 UTC to refresh prices and detect out-of-stock
# or discontinued products in the alternatives data.
#
# Also available as a manual trigger from the Actions tab.
#
# ⚠️  NOTE: Amazon may block requests from GitHub-hosted runner IPs.
#     If this workflow consistently fails, run the scraper locally instead:
#       python3 scripts/scrape_alternatives.py --refresh-prices --update --verbose
#
# Required repository secrets:
#   (none — price refresh does not require OpenAI)
name: Scheduled Price Update

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        required: false
        default: "refresh-prices"
        type: choice
        options:
          - refresh-prices
          - check-availability

# Allow only one concurrent run
concurrency:
  group: price-update
  cancel-in-progress: true

permissions:
  contents: write

# Ensure all JavaScript-based actions run on Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Python + scraper ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Determine update flags
        id: flags
        run: |
          MODE="${{ github.event.inputs.mode || 'refresh-prices' }}"
          if [ "$MODE" = "check-availability" ]; then
            echo "flags=--check-availability --update --verbose" >> $GITHUB_OUTPUT
          else
            echo "flags=--refresh-prices --update --verbose" >> $GITHUB_OUTPUT
          fi

      - name: Run price/availability update
        run: |
          cd scripts
          python3 scrape_alternatives.py ${{ steps.flags.outputs.flags }}

      # ── 3. Commit updated JSON if changed ─────────────────────────
      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/lovevery_alternatives.json
          if git diff --cached --quiet; then
            echo "No data changes detected — skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d")
            git commit -m "chore: auto-update prices and availability [$TIMESTAMP] [skip ci]"
            git push
          fi
