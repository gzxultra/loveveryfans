  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      color-scheme: light dark;
      --bg: #FAF8F3;
      --fg: #3D3229;
      --muted: #8A7D6E;
      --accent: #5F9E6E;
      --accent-hover: #527F5D;

    @media (prefers-color-scheme: dark) {
      :root {

        --accent: #7FB98A;
        --accent-hover: #93C79E;

        --ring: rgba(127, 185, 138, 0.22);
      }
    }
    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 8px 32px var(--ring), 0 2px 8px rgba(61, 50, 41, 0.04);
    }
    .code {
      font-family: 'Manrope', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Manrope', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .en {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 16px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 28px;
    }
    a {
      display: inline-block;
      padding: 12px 32px;
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s, transform 0.15s;
    }
    a:hover { background-color: var(--accent-hover); }
    a:active { transform: scale(0.97); }
    .brand {
      margin-top: 24px;
      font-family: 'Manrope', system-ui, sans-serif;
